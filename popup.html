<!DOCTYPE html>
<html>
<head>
  <title>LowTube Settings</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    label {
      font-weight: bold;
    }
    fieldset {
      border: 1px solid #ccc;
      border-radius: 4px;
      padding: 8px 12px 10px;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    legend {
      font-weight: bold;
      padding: 0 4px;
    }
    fieldset label {
      font-weight: normal;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }
    .hint {
      font-size: 12px;
      color: #666;
      margin: 0 0 0 22px;
    }
    input[type="number"] {
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      padding: 8px 16px;
      background-color: #ff0000;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover {
      background-color: #cc0000;
    }
    .status {
      color: #4CAF50;
      font-size: 14px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>LowTube Settings</h2>
    <div class="form-group">
      <label for="minViews">Minimum View Count:</label>
      <input type="number" id="minViews" min="0" placeholder="Enter minimum views">
    </div>
    <fieldset>
      <legend>Apply filter to</legend>
      <label><input type="checkbox" id="filterVideos"> Videos</label>
      <label><input type="checkbox" id="filterShorts"> Shorts</label>
      <label title="Compares the number of people watching now against the minimum"><input type="checkbox" id="filterLive"> Live streams</label>
    </fieldset>
    <fieldset>
      <legend>Exceptions</legend>
      <label><input type="checkbox" id="showSubscribed"> Always show channels I'm subscribed to</label>
      <p class="hint">Shorts don't say who posted them, so they're still filtered, except on the channel's own page.</p>
    </fieldset>
    <button id="saveButton">Save Settings</button>
    <div id="status" class="status">Settings saved!</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
